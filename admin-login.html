<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="admin_login.title">Admin Login — Yorlyn</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .login-page { min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a3a5c,#0f1f33); }
    .login-card { background:#fff;padding:3rem;width:100%;max-width:420px;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    .login-card h1 { font-size:1.5rem;margin-bottom:0.3rem;color:#1a1a2e; }
    .login-card p { color:#6b7280;font-size:0.85rem;margin-bottom:2rem; }
    .login-form { display:grid;gap:1.2rem; }
    .login-form label { font-size:0.8rem;font-weight:500;color:#1a1a2e;text-transform:uppercase;letter-spacing:0.05em; }
    .login-form input { padding:0.9rem 1rem;border:1px solid #e5e7eb;font-size:0.95rem;outline:none;transition:all 0.2s; }
    .login-form input:focus { border-color:#1a3a5c;box-shadow:0 0 0 3px rgba(26,58,92,0.08); }
    .login-form button { padding:0.9rem;background:#1a3a5c;color:#fff;border:none;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s; }
    .login-form button:hover { background:#234b72; }
    .login-error { color:#ef4444;font-size:0.85rem;margin-top:0.5rem;display:none; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1 data-i18n="admin_login.title">管理后台</h1>
      <p data-i18n="admin_login.subtitle">请输入管理员账号密码登录</p>
      <form class="login-form" id="login-form">
        <div>
          <label data-i18n="admin_login.email">Email</label>
          <input type="email" id="email" placeholder="admin@yorlyn.com" required>
        </div>
        <div>
          <label data-i18n="admin_login.password">Password</label>
          <input type="password" id="password" placeholder="********" required>
        </div>
        <div class="login-error" id="login-error">登录失败，请检查邮箱和密码</div>
        <button type="submit" data-i18n="admin_login.login">登录</button>
      </form>
      <p style="margin-top:2rem;font-size:0.75rem;color:#9ca3af;text-align:center;" data-i18n="admin_login.first_use">
        首次使用？请先在 Supabase 控制台创建用户，<br>或使用 SQL 创建默认管理员账号。
      </p>
    </div>
  </div>
  
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    initI18n()
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const errorEl = document.getElementById('login-error')
      try {
        await adminLogin(email, password)
        location.href = 'admin.html'
      } catch (err) {
        errorEl.style.display = 'block'
        errorEl.textContent = '登录失败: ' + (err.message || '请检查邮箱和密码')
      }
    })
  </script>
</body>
</html>
