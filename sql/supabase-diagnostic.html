<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Supabase 诊断工具</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; background: #f8fafc; }
    h1 { font-size: 1.5rem; color: #1a1a2e; }
    .card { background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 1rem; }
    button { background: #1a3a5c; color: #fff; border: none; padding: 0.7rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-right: 0.5rem; margin-bottom: 0.5rem; }
    button:hover { background: #2d4a6c; }
    .result { background: #f1f5f9; padding: 1rem; border-radius: 6px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; margin-top: 0.5rem; }
    .error { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; }
    .success { color: #059669; background: #f0fdf4; border: 1px solid #bbf7d0; }
    .info { color: #2563eb; background: #eff6ff; border: 1px solid #bfdbfe; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 0.6rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f1f5f9; font-weight: 600; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
</head>
<body>
  <h1>Supabase 诊断工具</h1>
  <p style="color:#6b7280;">用于检查数据库表是否存在、测试插入数据等</p>
  
  <div class="card">
    <h3>第一步：连接信息</h3>
    <p>Supabase URL: <code id="url-display"></code></p>
    <p>项目: <code>txaruompovbolumogggm</code></p>
  </div>
  
  <div class="card">
    <h3>第二步：检查表是否存在</h3>
    <button onclick="checkTables()">检查 logs / log_likes / log_comments 表</button>
    <div id="tables-result" class="result" style="display:none;"></div>
  </div>
  
  <div class="card">
    <h3>第三步：测试插入数据（测试 logs 表）</h3>
    <button onclick="testInsert()">测试插入一条日志数据</button>
    <div id="insert-result" class="result" style="display:none;"></div>
  </div>
  
  <div class="card">
    <h3>第四步：查询所有表</h3>
    <button onclick="listAllTables()">列出所有 public 表</button>
    <div id="all-tables-result" class="result" style="display:none;"></div>
  </div>
  
  <div class="card">
    <h3>第五步：检查 RLS 策略</h3>
    <button onclick="checkRLS()">检查 logs 表 RLS 策略</button>
    <div id="rls-result" class="result" style="display:none;"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://txaruompovbolumogggm.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4YXJ1b21wb3Zib2x1bW9nZ2dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzc4NjQsImV4cCI6MjA5Njk1Mzg2NH0.fyUp-xgE5PC5jxP6pptRU8PGaX25nE_lNWy5dkn4m9k'
    
    document.getElementById('url-display').textContent = SUPABASE_URL
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    
    async function checkTables() {
      const result = document.getElementById('tables-result')
      result.style.display = 'block'
      result.className = 'result info'
      result.textContent = '检查中...'
      
      const tables = ['logs', 'log_likes', 'log_comments']
      const results = []
      
      for (const table of tables) {
        try {
          const { data, error } = await sb.from(table).select('count').limit(1)
          if (error) {
            results.push(`❌ ${table}: ${error.message}`)
          } else {
            results.push(`✅ ${table}: 表存在，可查询`)
          }
        } catch (err) {
          results.push(`❌ ${table}: ${err.message}`)
        }
      }
      
      result.className = 'result'
      result.textContent = results.join('\n')
    }
    
    async function testInsert() {
      const result = document.getElementById('insert-result')
      result.style.display = 'block'
      result.className = 'result info'
      result.textContent = '测试中...'
      
      try {
        const { data, error } = await sb.from('logs').insert({
          title: '测试日志',
          content: '这是一条测试数据，如果看到说明表已创建成功',
          log_date: new Date().toISOString().split('T')[0],
          status: 'published'
        }).select()
        
        if (error) {
          result.className = 'result error'
          result.textContent = '插入失败: ' + error.message + '\n\n错误详情:\n' + JSON.stringify(error, null, 2)
        } else {
          result.className = 'result success'
          result.textContent = '插入成功！\n\n返回数据:\n' + JSON.stringify(data, null, 2)
        }
      } catch (err) {
        result.className = 'result error'
        result.textContent = '异常: ' + err.message
      }
    }
    
    async function listAllTables() {
      const result = document.getElementById('all-tables-result')
      result.style.display = 'block'
      result.className = 'result info'
      result.textContent = '查询中...'
      
      try {
        const { data, error } = await sb.rpc('get_tables')
        if (error) {
          // Fallback: query information_schema directly
          const { data: schemaData, error: schemaError } = await sb
            .from('information_schema.tables')
            .select('table_name')
            .eq('table_schema', 'public')
            .order('table_name')
          
          if (schemaError) {
            result.className = 'result error'
            result.textContent = '查询失败: ' + schemaError.message
          } else {
            result.className = 'result success'
            result.textContent = 'Public 表列表:\n' + (schemaData || []).map(r => r.table_name).join('\n')
          }
        } else {
          result.className = 'result success'
          result.textContent = '表列表:\n' + JSON.stringify(data, null, 2)
        }
      } catch (err) {
        result.className = 'result error'
        result.textContent = '异常: ' + err.message
      }
    }
    
    async function checkRLS() {
      const result = document.getElementById('rls-result')
      result.style.display = 'block'
      result.className = 'result info'
      result.textContent = '查询中...'
      
      try {
        // Try to read logs as anonymous user
        const { data, error } = await sb.from('logs').select('*').limit(1)
        
        if (error) {
          result.className = 'result error'
          result.textContent = 'RLS 检查失败: ' + error.message + '\n\n这意味着要么表不存在，要么 RLS 策略阻止了匿名访问。'
        } else {
          result.className = 'result success'
          result.textContent = 'RLS 检查通过：匿名用户可以查询 logs 表\n\n返回数据:\n' + JSON.stringify(data, null, 2)
        }
      } catch (err) {
        result.className = 'result error'
        result.textContent = '异常: ' + err.message
      }
    }
  </script>
</body>
</html>
