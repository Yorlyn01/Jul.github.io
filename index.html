<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E">
  <link rel="shortcut icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E">
  <title>我来过 | We Were Here</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080b;
      --ink: #f6f2e8;
      --muted: #a9b0bd;
      --line: rgba(255,255,255,.14);
      --panel: rgba(13,16,22,.76);
      --live: #8de5ff;
      --memory: #ffd27a;
      --green: #87e8b1;
      --danger: #ff938d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 24%, rgba(123, 180, 255, .16), transparent 30%),
        radial-gradient(circle at 78% 72%, rgba(255, 196, 112, .13), transparent 26%),
        var(--bg);
      color: var(--ink);
    }

    button, textarea, input, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    #globe {
      position: fixed;
      inset: 0;
      height: 100vh;
      z-index: 0;
    }

    #globe canvas {
      cursor: grab;
      display: block;
      touch-action: none;
    }

    #globe canvas:active {
      cursor: grabbing;
    }

    .city-label-layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .city-label {
      position: absolute;
      min-width: 0;
      transform: translate(-50%, -50%);
      padding: 3px 6px;
      border-radius: 999px;
      color: rgba(244,248,255,.92);
      background: rgba(5,8,12,.52);
      border: 1px solid rgba(255,255,255,.16);
      font-size: 10px;
      line-height: 1.15;
      white-space: nowrap;
      text-shadow: 0 1px 8px rgba(0,0,0,.9);
      opacity: 0;
      transition: opacity .18s ease;
    }

    .city-label strong {
      display: block;
      font-size: 11px;
      font-weight: 720;
    }

    .city-label span {
      color: rgba(210,219,232,.78);
      font-size: 9px;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.86) 0 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.42) 0 1px, transparent 1px);
      background-position: 0 0, 30px 40px;
      background-size: 150px 150px, 230px 230px;
      opacity: .38;
    }

    .shell {
      position: fixed;
      inset: auto 0 0 0;
      z-index: 2;
      height: 0;
      display: block;
      padding: 0;
      pointer-events: none;
    }

    .panel {
      pointer-events: auto;
      background: linear-gradient(180deg, rgba(18,22,30,.78), rgba(9,12,17,.66));
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 20px 70px rgba(0,0,0,.38);
      backdrop-filter: blur(18px);
    }

    .left, .right {
      position: fixed;
      bottom: 14px;
      width: min(280px, calc(50vw - 24px));
      max-height: 34vh;
      overflow: auto;
    }

    .left { left: 14px; }
    .right { right: 14px; }

    .brand {
      padding: 9px 11px 8px;
      border-bottom: 1px solid var(--line);
    }

    .brand small {
      display: none;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 10px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .tagline {
      display: none;
      margin: 8px 0 0;
      color: #d8dde7;
      line-height: 1.45;
      font-size: 11px;
    }

    .section {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }

    .section:last-child {
      border-bottom: 0;
    }

    #nameInput,
    .privacy {
      display: none;
    }

    .section h2 {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0;
    }

    .locator {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 6px;
    }

    .locator h2 {
      grid-column: 1 / -1;
      margin-bottom: 0;
    }

    .locator .status {
      grid-column: 1 / -1;
    }

    .locator .primary,
    .locator .ghost {
      width: 100%;
      min-height: 30px;
      padding: 0 10px;
      font-size: 11px;
      line-height: 1.2;
    }

    .status {
      min-height: 34px;
      padding: 7px 8px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      background: rgba(255,255,255,.045);
      color: #dbe2ea;
      font-size: 11px;
      line-height: 1.35;
    }

    .primary {
      min-height: 34px;
      border-radius: 8px;
      background: #f2ede1;
      color: #101217;
      font-weight: 760;
      transition: transform .18s ease, background .18s ease;
    }

    .primary:hover {
      transform: translateY(-1px);
      background: #fff8ea;
    }

    .ghost {
      min-height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.12);
    }

    .form {
      display: grid;
      gap: 6px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .tab {
      min-height: 32px;
      font-size: 12px;
      border-radius: 8px;
      background: rgba(255,255,255,.07);
      color: #dbe2ea;
      border: 1px solid transparent;
    }

    .tab.active {
      border-color: rgba(255,255,255,.26);
      background: rgba(255,255,255,.14);
      color: #fff;
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 8px;
      background: rgba(0,0,0,.24);
      color: var(--ink);
      outline: 0;
    }

    textarea {
      min-height: 44px;
      resize: vertical;
      padding: 8px;
      line-height: 1.45;
    }

    input, select {
      min-height: 32px;
      padding: 0 8px;
      font-size: 12px;
    }

    .privacy {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .stat {
      padding: 7px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
    }

    .stat strong {
      display: block;
      font-size: 16px;
      line-height: 1;
      margin-bottom: 7px;
    }

    .stat span {
      color: var(--muted);
      font-size: 10px;
    }

    .feed {
      display: grid;
      gap: 6px;
    }

    .footprint {
      padding: 8px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 8px;
      background: rgba(255,255,255,.055);
    }

    .footprint header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 7px;
      box-shadow: 0 0 18px currentColor;
    }

    .dot.live { color: var(--live); background: var(--live); }
    .dot.memory { color: var(--memory); background: var(--memory); }

    .footprint p {
      margin: 0;
      color: #edf1f7;
      line-height: 1.56;
      font-size: 11px;
    }

    .center-copy {
      position: fixed;
      left: 14px;
      top: 12px;
      transform: none;
      z-index: 3;
      width: min(310px, calc(100vw - 28px));
      padding: 0;
      text-align: left;
      pointer-events: none;
      text-shadow: 0 2px 20px rgba(0,0,0,.8);
    }

    .center-copy h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .center-copy p {
      max-width: 300px;
      margin: 6px 0 0;
      color: #d8dee8;
      line-height: 1.4;
      font-size: 11px;
    }

    .callout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 26px;
      padding: 0 9px;
      margin-bottom: 6px;
      border-radius: 999px;
      color: #f7f4ea;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.15);
      font-size: 11px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 5;
      width: min(520px, calc(100vw - 32px));
      transform: translate(-50%, 120%);
      padding: 13px 16px;
      border-radius: 8px;
      background: rgba(9,12,17,.9);
      border: 1px solid rgba(255,255,255,.16);
      color: #eef4ff;
      transition: transform .28s ease;
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

    .story-modal {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.36);
      backdrop-filter: blur(5px);
    }

    .story-modal.show {
      display: flex;
    }

    .story-card {
      width: min(420px, calc(100vw - 28px));
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(12,15,20,.9);
      box-shadow: 0 24px 90px rgba(0,0,0,.56);
    }

    .story-photo {
      height: 190px;
      background: #111820 center / cover no-repeat;
      border-bottom: 1px solid rgba(255,255,255,.14);
    }

    .story-body {
      padding: 16px;
    }

    .story-body header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .story-body h2 {
      margin: 0 0 5px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .story-place {
      color: var(--muted);
      font-size: 12px;
    }

    .story-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: #fff;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.14);
      font-size: 21px;
      line-height: 1;
    }

    .story-message {
      margin: 0;
      color: #f3f5f8;
      line-height: 1.65;
      font-size: 14px;
    }

    .story-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .story-meta span {
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #d7deea;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,.1);
    }

    .ritual-note {
      display: grid;
      gap: 4px;
      margin-top: 6px;
      color: rgba(218,226,239,.78);
      font-size: 10px;
      line-height: 1.35;
    }

    .archive-row {
      display: grid;
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    .archive-row h3 {
      margin: 0;
      color: #f4f0e6;
      font-size: 12px;
      letter-spacing: 0;
    }

    .archive-row ul {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: rgba(220,228,240,.82);
      font-size: 11px;
      line-height: 1.35;
    }

    .archive-row li::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 5px;
      margin-right: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
      vertical-align: 1px;
    }

    @media (max-width: 1060px) {
      body { overflow: auto; }
      #globe { height: 100vh; }
      .shell {
        position: fixed;
        height: auto;
        padding: 0;
      }
      .left, .right {
        width: min(340px, calc(50vw - 18px));
        max-height: 40vh;
      }
      .center-copy {
        top: 12px;
        left: 12px;
        width: min(300px, calc(100vw - 24px));
      }
    }

    @media (max-width: 520px) {
      .privacy, .stat-grid { grid-template-columns: 1fr; }
      .brand, .section { padding-left: 16px; padding-right: 16px; }
      h1 { font-size: 26px; }
      .left, .right {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        width: calc(100vw - 24px);
        max-height: none;
        margin: 12px;
      }
      .shell {
        position: relative;
        padding-top: 58vh;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <div id="globe" aria-hidden="true"></div>
  <div class="city-label-layer" id="cityLabelLayer" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>

  <main class="shell">
    <aside class="panel left">
      <div class="brand">
        <small>Global map of human presence</small>
        <h1>我来过<br>We Were Here</h1>
        <p class="tagline">每个人只有一个本命坐标。活着的人闪现，离开的人长留。</p>
      </div>

      <section class="section locator">
        <h2>你的坐标</h2>
        <div class="status" id="locationStatus">开启位置后，地球会转向你的大致城市。不会展示精确地址。</div>
        <button class="primary" id="locateBtn">开启 IP / 位置并靠近地球</button>
        <button class="ghost" id="demoBtn">使用演示坐标</button>
      </section>

      <section class="section">
        <h2>今天的存在证据</h2>
        <form class="form" id="footprintForm">
          <div class="tabs" role="tablist" aria-label="足迹类型">
            <button class="tab active" type="button" data-type="live">我还在这里</button>
            <button class="tab" type="button" data-type="memory">纪念一个人</button>
          </div>
          <input id="nameInput" maxlength="36" placeholder="名字或匿名称呼">
          <textarea id="messageInput" maxlength="220" placeholder="今天，你想在地球上留下什么？"></textarea>
          <div class="privacy">
            <select id="privacySelect" aria-label="位置显示方式">
              <option value="city">显示城市</option>
              <option value="country">只显示国家</option>
              <option value="hidden">隐藏位置</option>
            </select>
            <select id="moodSelect" aria-label="足迹标签">
              <option>继续生活</option>
              <option>想被听见</option>
              <option>感谢一个人</option>
              <option>我想记住</option>
            </select>
          </div>
          <div class="ritual-note">
            <span>本命坐标：第一次打卡的位置会成为你的生命原点。</span>
            <span>今日足迹：每天只留下一个真实时刻。</span>
            <span>纪念星：为离开的人留下永久金色星点。</span>
          </div>
          <button class="primary" type="submit">把足迹放到地球上</button>
        </form>
      </section>
    </aside>

    <section class="center-copy" aria-label="产品宣言">
      <div class="callout"><span class="dot live"></span>生命信号 <span class="dot memory"></span>永久纪念星</div>
      <h2>把人类存在变成星光。</h2>
      <p>蓝色是今天还在生活的人，短暂闪现。金色是已经离开的人，永久停留。</p>
    </section>

    <aside class="panel right">
      <section class="section">
        <h2>今日地球</h2>
        <div class="stat-grid">
          <div class="stat"><strong id="liveCount">0</strong><span>活着的足迹</span></div>
          <div class="stat"><strong id="memoryCount">0</strong><span>纪念足迹</span></div>
        </div>
      </section>
      <section class="section">
        <h2 id="feedTitle">当前地球正面的最近打卡</h2>
        <div class="feed" id="feed"></div>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="story-modal" id="storyModal" aria-hidden="true">
    <article class="story-card" role="dialog" aria-modal="true" aria-labelledby="storyName">
      <div class="story-photo" id="storyPhoto"></div>
      <div class="story-body">
        <header>
          <div>
            <h2 id="storyName">Anonymous</h2>
            <div class="story-place" id="storyPlace">Earth</div>
          </div>
          <button class="story-close" id="storyClose" type="button" aria-label="关闭故事">×</button>
        </header>
        <p class="story-message" id="storyMessage"></p>
        <div class="story-meta" id="storyMeta"></div>
        <div class="archive-row">
          <h3>生命轨迹</h3>
          <ul id="storyTrail"></ul>
        </div>
      </div>
    </article>
  </div>

    function latLonToVec3(lat, lon, radius = RADIUS + 0.04) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function angularDistance(aLat, aLon, bLat, bLon) {
      const toRad = value => value * Math.PI / 180;
      const p1 = toRad(aLat);
      const p2 = toRad(bLat);
      const dLat = toRad(bLat - aLat);
      const dLon = toRad(bLon - aLon);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dLon / 2) ** 2;
      return 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h)) * 180 / Math.PI;
    }

    function visibleFootprints(center = activeRegion) {
      if (!center) return footprints.slice().reverse().slice(0, 8);
      const nearby = footprints
        .map(item => ({ item, distance: angularDistance(center.lat, center.lon, item.lat, item.lon) }))
        .filter(row => row.distance < 48)
        .sort((a, b) => a.distance - b.distance)
        .map(row => row.item);
      return nearby.length ? nearby.slice(0, 3) : footprints.slice().reverse().slice(0, 3);
    }

    function emitLightBeam(item) {
      const color = markerColor(item.type);
      const normal = latLonToVec3(item.lat, item.lon, 1).normalize();
      const origin = normal.clone().multiplyScalar(RADIUS + 0.08);
      const beamHeight = 1.45;
      const group = new THREE.Group();
      group.position.copy(origin);
      group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
      group.userData.started = performance.now();
      group.userData.duration = 1450;

      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.006, 0.022, beamHeight, 18, 1, true),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.86,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      shaft.position.y = beamHeight / 2;
      group.add(shaft);

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 18, 18),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.64,
          blending: THREE.AdditiveBlending,
          depthWrite: false

      );
      group.add(glow);

      beamGroup.add(group);

    function updateCityLabels() {
      const showLabels = currentCameraDistance <= 4.6;
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;
      cityLabels.forEach(label => {
        if (!showLabels) {
          label.el.style.opacity = 0;
          return;
        }
        const world = latLonToVec3(label.lat, label.lon, RADIUS + 0.08);
        globeGroup.localToWorld(world);
        const normal = world.clone().normalize();
        const cameraDir = camera.position.clone().normalize();
        if (normal.dot(cameraDir) < 0.18) {
          label.el.style.opacity = 0;
          return;
        }
        const projected = world.clone().project(camera);
        if (projected.z < -1 || projected.z > 1) {
          label.el.style.opacity = 0;
          return;
        }
        label.el.style.left = `${(projected.x * 0.5 + 0.5) * width}px`;
        label.el.style.top = `${(-projected.y * 0.5 + 0.5) * height}px`;
        label.el.style.opacity = Math.min(1, (4.6 - currentCameraDistance) / 1.15 + 0.18);
      });
    }

    function escapeHtml(value) {

        .replaceAll('&', '&amp;')

        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function focusOn(lat, lon, distance = FULL_VIEW_DISTANCE) {
      const target = latLonToVec3(lat, lon, RADIUS);
      const desiredDistance = Math.max(distance, MIN_ZOOM_DISTANCE);
      currentCameraDistance = Math.min(Math.max(desiredDistance, MIN_ZOOM_DISTANCE), MAX_ZOOM_DISTANCE);
      const desired = target.clone().normalize().multiplyScalar(currentCameraDistance);
      camera.userData.from = camera.position.clone();
      camera.userData.to = desired;
      camera.userData.started = performance.now();
      camera.userData.duration = 1300;
    }

    function zoomCamera(delta) {
      lastUserInteraction = performance.now();
      camera.userData.to = null;
      const factor = delta > 0 ? 1.07 : 0.93;
      currentCameraDistance = Math.min(MAX_ZOOM_DISTANCE, Math.max(MIN_ZOOM_DISTANCE, currentCameraDistance * factor));
      camera.position.normalize().multiplyScalar(currentCameraDistance);
      camera.lookAt(0, 0, 0);
    }

    function markerHitFromEvent(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(markerGroup.children, true);
      return hits.find(row => row.object.userData && row.object.userData.itemId);
    }

    function pickMarker(event) {
      const hit = markerHitFromEvent(event);
      if (!hit) return;
      const item = itemById(hit.object.userData.itemId);
      if (!item) return;
      lastUserInteraction = performance.now();
      setActiveRegion(item.lat, item.lon, item.city);
      openStory(item);
    }

    function startDrag(event, global = false) {
      lastUserInteraction = performance.now();
      camera.userData.to = null;
      dragState.active = true;
      dragState.moved = false;
      dragState.global = global;
      dragState.x = event.clientX;
      dragState.y = event.clientY;
      dragState.startX = event.clientX;
      dragState.startY = event.clientY;
      if (!global) renderer.domElement.setPointerCapture(event.pointerId);
    }

    function moveDrag(event) {
      if (!dragState.active) return;
      const dx = event.clientX - dragState.x;
      const dy = event.clientY - dragState.y;
      if (Math.abs(event.clientX - dragState.startX) + Math.abs(event.clientY - dragState.startY) > 6) {
        dragState.moved = true;
      }
      dragState.velocityX = dx * 0.0018;
      dragState.velocityY = dy * 0.0012;
      globeGroup.rotation.y += dragState.velocityX;
      globeGroup.rotation.x += dragState.velocityY;
      globeGroup.rotation.x = Math.max(-0.9, Math.min(0.9, globeGroup.rotation.x));
      dragState.x = event.clientX;
      dragState.y = event.clientY;
    }

    function endDrag(event) {
      if (!dragState.active) return;
      const wasGlobal = dragState.global;
      dragState.active = false;
      try {
        if (!wasGlobal) renderer.domElement.releasePointerCapture(event.pointerId);
      } catch (error) {}
      if (!dragState.moved && !wasGlobal) pickMarker(event);
    }

    renderer.domElement.addEventListener('pointerdown', event => startDrag(event, false));
    renderer.domElement.addEventListener('pointermove', event => {
      moveDrag(event);
      if (!dragState.active) updateMarkerHover(event);
    });
    renderer.domElement.addEventListener('pointerup', endDrag);
    renderer.domElement.addEventListener('pointerleave', () => {
      hoveredMarkerId = null;
      renderer.domElement.style.cursor = 'grab';
    });

    renderer.domElement.addEventListener('wheel', event => {

    }, { passive: false });

    window.addEventListener('pointerdown', event => {
      if (event.target === renderer.domElement) return;
      if (event.target.closest('.panel, .story-modal, .toast, button, input, textarea, select')) return;

    async function locateByIp() {
      statusEl.textContent = '正在通过 IP 估算你所在的大致城市...';
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (!res.ok) throw new Error('IP service unavailable');
        const data = await res.json();
        if (!Number.isFinite(data.latitude) || !Number.isFinite(data.longitude)) {
          throw new Error('No coordinates');
        }
        setLocation({
          city: data.city || 'Unknown city',
          country: data.country_name || 'Unknown country',
          lat: data.latitude,
          lon: data.longitude
        }, 'ip');
      } catch (error) {
        statusEl.textContent = 'IP 定位暂时不可用，已切换到演示坐标。正式版可接入自己的后端定位服务。';
        setLocation(userLocation, 'demo');
      }
    }

    locateBtn.addEventListener('click', locateByIp);
    demoBtn.addEventListener('click', () => setLocation(userLocation, 'demo'));

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        activeType = tab.dataset.type;
        tabs.forEach(item => item.classList.toggle('active', item === tab));
        messageInput.placeholder = activeType === 'memory'
          ? '你想让世界记住这个人的哪一刻？'
          : '今天，你想在地球上留下什么？';
        nameInput.placeholder = activeType === 'memory' ? '被纪念的人' : '名字或匿名称呼';
      });
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message) {
        showToast('先写下一句话，地球才知道要记住什么。');
        return;
      }

      const privacy = privacySelect.value;
      const entry = {
        id: `fp-${Date.now()}`,
        type: activeType,
        name: nameInput.value.trim() || (activeType === 'memory' ? 'Someone remembered' : 'Anonymous'),
        city: privacy === 'country' ? 'Hidden city' : userLocation.city,
        country: userLocation.country,
        hidden: privacy === 'hidden',
        lat: userLocation.lat,
        lon: userLocation.lon,
        mood: moodSelect.value,
        message,
        story: activeType === 'memory'
          ? `有人把这个名字交给地球保存：${message}`
          : `今天我把这一刻留在自己的本命坐标附近：${message}`,
        photo: samplePhotos[Math.floor(Math.random() * samplePhotos.length)],
        origin: !footprints.some(item => item.name === (nameInput.value.trim() || 'Anonymous') && item.origin),
        capsule: `20${34 + Math.floor(Math.random() * 8)}-${String(Math.floor(Math.random() * 12) + 1).padStart(2, '0')}-01`,
        guardians: activeType === 'memory' ? 1 : 0,
        trail: activeType === 'memory'
          ? ['亲友留下这颗纪念星', '故事被交给地球保存', '未来每次被点开，名字都会再次亮起']
          : ['第一次确认自己的本命坐标', '留下今日存在证据', '等待未来某一天重新打开']
      };

      /* 保存到 Supabase 数据库 */
      if (supabase) {
        try {
          const { error } = await supabase.from('footprints').insert({
            type: entry.type,
            name: entry.name,
            city: entry.city,
            country: entry.country,
            lat: entry.lat,
            lon: entry.lon,
            mood: entry.mood,
            message: entry.message,
            story: entry.story,
            photo: entry.photo,
            origin: entry.origin,
            capsule: entry.capsule,
            guardians: entry.guardians,
            trail: entry.trail,
            hidden: entry.hidden
          });
          if (error) throw error;
        } catch (err) {
          console.warn('数据库保存失败，足迹仅在本地显示：', err);
        }
      }

      footprints.push(entry);
      refreshMarkers();
      markLatest(entry);
      focusOn(entry.lat, entry.lon, FULL_VIEW_DISTANCE);
      showToast(activeType === 'memory' ? '纪念足迹已经留在地球上。' : '你的今日足迹已经留在地球上。');
      messageInput.value = '';
    });

    function animate(time) {
      requestAnimationFrame(animate);
      if (!dragState.active) {
        globeGroup.rotation.y += 0.0011 + dragState.velocityX;
        globeGroup.rotation.x += dragState.velocityY;
        globeGroup.rotation.x = Math.max(-0.9, Math.min(0.9, globeGroup.rotation.x));
        dragState.velocityX *= 0.9;
        dragState.velocityY *= 0.88;
        if (Math.abs(dragState.velocityX) < 0.00003) dragState.velocityX = 0;
        if (Math.abs(dragState.velocityY) < 0.00003) dragState.velocityY = 0;
      }
      clouds.rotation.y += 0.0007;
      const now = performance.now();
      markerGroup.children.forEach((marker, index) => {
        const isLive = marker.userData.type === 'live';
        const isFlashing = isLive && marker.userData.latest && now < marker.userData.flashUntil;
        if (isLive && now >= marker.userData.flashUntil) {
          marker.visible = false;
          marker.userData.latest = false;
          if (latestItemId === marker.userData.itemId) latestItemId = null;
          return;
        }
        marker.visible = marker.userData.type === 'memory' || isFlashing;
        const isHovered = hoveredMarkerId === marker.userData.itemId;
        const pulse = isFlashing ? 0.18 : isHovered ? 0.05 : 0.01;
        const base = isFlashing ? 1.18 : isHovered ? 1.28 : marker.userData.active ? 1.02 : 0.92;
        const scale = base + Math.sin(time * 0.006 + index) * pulse;
        marker.children.forEach((child, childIndex) => {
          if (child.material && child.material.opacity !== undefined) {
            child.material.opacity = isFlashing
              ? Math.max(0.16, 0.92 + Math.sin(time * 0.014 + index + childIndex) * 0.08)
              : isHovered
                ? Math.max(child.userData.baseOpacity, 0.78)
              : child.userData.baseOpacity;
          }
        });
        marker.scale.setScalar(scale);
      });

      for (let i = beamGroup.children.length - 1; i >= 0; i -= 1) {
        const beam = beamGroup.children[i];
        const elapsed = performance.now() - beam.userData.started;
        const t = Math.min(elapsed / beam.userData.duration, 1);
        const lift = 1 + t * 0.16;
        beam.scale.set(lift, 1 + t * 0.42, lift);
        beam.children.forEach(child => {
          if (child.material) child.material.opacity = (1 - t) * (child === beam.children[0] ? 0.86 : 0.64);
        });
        if (t >= 1) beamGroup.remove(beam);
      }

      if (camera.userData.to) {
        const elapsed = performance.now() - camera.userData.started;
        const t = Math.min(elapsed / camera.userData.duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(camera.userData.from, camera.userData.to, eased);
        camera.lookAt(0, 0, 0);
        if (t >= 1) camera.userData.to = null;
      }

      updateCityLabels();
      renderer.render(scene, camera);
    }

    function resize() {
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    window.addEventListener('resize', resize);

    /* ===== 从 Supabase 加载真实足迹 ===== */
    async function loadFootprintsFromDB() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase
          .from('footprints')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(200);
        if (error) throw error;
        if (data && data.length > 0) {
          /* 清除旧的演示数据，用真实数据替换 */
          footprints.length = 0;
          data.forEach(row => {
            footprints.push({
              id: `fp-${row.id}`,
              type: row.type || 'live',
              name: row.name || 'Anonymous',
              city: row.city || '',
              country: row.country || '',
              lat: row.lat || 0,
              lon: row.lon || 0,
              mood: row.mood || '',
              message: row.message || '',
              story: row.story || row.message || '',
              photo: row.photo || samplePhotos[Math.floor(Math.random() * samplePhotos.length)],
              origin: row.origin || false,
              capsule: row.capsule || '',
              guardians: row.guardians || 0,
              trail: Array.isArray(row.trail) ? row.trail : [],
              hidden: row.hidden || false
            });
          });
          refreshMarkers();
          renderFeed();
        }
      } catch (err) {
        console.warn('数据库加载失败，使用演示数据：', err);
      }
    }

    refreshMarkers();
    markLatest(footprints.find(item => item.type === 'memory') || footprints[0], { beam: false });
    focusOn(24, 35, FULL_VIEW_DISTANCE);
    loadFootprintsFromDB();
    setInterval(() => {
      const isReading = storyModal.classList.contains('show');
      const recentlyTouched = performance.now() - lastUserInteraction < 15000;
      if (isReading || recentlyTouched || dragState.active) return;
      const next = footprints[Math.floor(Math.random() * footprints.length)];
      markLatest(next);
      focusOn(next.lat, next.lon, FULL_VIEW_DISTANCE);
      showToast(`${next.city} 附近有人刚刚留下足迹。`);
    }, 5600);
    animate(0);
  </script>
</body>
